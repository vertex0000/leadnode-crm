<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unsubscribe · Nodevers</title><meta name="robots" content="noindex">
<style>:root{--bg:#f6f7fb;--text:#16181d;--muted:#5b6170;--card:#fff;--line:#e4e6ee;--ok:#2FA36B;--bad:#E8707E}@media (prefers-color-scheme:dark){:root{--bg:#0b0c0f;--text:#eceef3;--muted:#9aa0ad;--card:#15171c;--line:#262a33}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;max-width:440px;width:100%;text-align:center}.ic{font-size:36px;margin-bottom:6px}h1{font-size:22px;margin:0 0 8px}p{color:var(--muted);margin:0}</style></head>
<body><div class="card" id="c"><div class="ic">⏳</div><h1>Unsubscribing…</h1><p>One moment.</p></div>
<script>
(async () => {
  const c = document.getElementById('c'), u = new URLSearchParams(location.search).get('u');
  const show = (ic, h, p) => { c.innerHTML = `<div class="ic">${ic}</div><h1></h1><p></p>`; c.querySelector('h1').textContent = h; c.querySelector('p').textContent = p; };
  if (!u) return show('⚠️', 'Link not complete', 'Please open the unsubscribe link from the email again.');
  try {
    const r = await fetch('https://ljllsrinjjbraumacobz.supabase.co/functions/v1/email', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_L8mKKUhWlkJbL9ArKELJIA_FHnjJfS3' }, body: JSON.stringify({ action: 'unsub', u }) });
    const j = await r.json();
    if (j.ok) show('✅', 'You are unsubscribed', `You will not get marketing emails${j.business ? ' from ' + j.business : ''} any more.`);
    else show('⚠️', 'Could not unsubscribe', j.error || 'Please try again later.');
  } catch (e) { show('⚠️', 'Could not unsubscribe', 'Please check your internet and open the link again.'); }
})();
</script></body></html>
